[package]
name = "chobiyori"
version = "0.2.6"
description = "個人事業主向けの確定申告用会計ソフト"
edition = "2021"
rust-version = "1.92"
license = "ISC"
publish = false

[lib]
# Windows でバイナリ名とライブラリ名が衝突しないよう、別名にする
name = "chobiyori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
tauri-plugin-notification = "=2.8.1"
# 0.42.0 は公開から 7 日たつ前（2026-11-11 公開）に入れた。同梱の SQLite の脆弱性
# （RUSTSEC-2026-0502、sqlcipher-src 420.0.0 で修正）を直すため、セキュリティ修正として例外にした。
# 一緒に上がる sqlite-wasm-rs 0.6.3（2026-11-10 公開）は WebAssembly 向けだけで、このアプリのビルドには入らない
rusqlite = { version = "=0.42.0", features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
# 帳簿の出力と取込（フェーズ 3）。CSV の読み書き、Shift_JIS、Excel の読み取り、PDF の作成
csv = "1.4.0"
encoding_rs = "0.8.44"
calamine = { version = "0.38.0", default-features = false }
# PDF は日本語を PC のフォント（游ゴシック・ヒラギノなど）で書き、使った文字だけを埋め込む
krilla = { version = "0.8.2", default-features = false, features = ["simple-text", "raster-images"] }
ttf-parser = "0.25.1"
# 保存先と取り込むファイルを選ぶ画面。Rust 側から開くので、画面に権限は渡さない
tauri-plugin-dialog = "2.8.4"
# レシートの読み取り（フェーズ 6）。Gemini API を Rust 側から呼ぶ。TLS は rustls（ring）で、
# 自動アップデートと同じ版・同じ機能を使う（新しい crate を増やさない）
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# API キーは OS の資格情報ストア（Windows の資格情報マネージャー・macOS のキーチェーン）に置く
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }
# 請求書のメール送信（フェーズ 9）。SMTP、TLS は rustls（ring）で、証明書は OS のものを使う
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "rustls-platform-verifier"] }
# メールソフト（mailto:）と、保存した PDF のフォルダを開く。Rust 側からだけ使い、画面に権限は渡さない。
# 2.7.3（2026-11-10 公開）は 7 日たっていないので 2.7.2 に固定する
tauri-plugin-opener = "=2.7.2"
# 証憑のハッシュと、画像を API に送るときの base64
sha2 = "0.10.9"
base64 = "0.22.1"
# 復旧コードの生成と、コードで保護した鍵情報の保存（既存の依存を使用）
ring = "0.17.14"
tempfile = "3.27.0"

# 自動アップデートはデスクトップだけで使う
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

# アプリ終了後にも申告期限を通知する OS の予約 API
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[profile.release]
# 配布サイズとメモリ使用量を抑える
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
# 取込のテストで、Excel 帳簿のフィクスチャを作る
rust_xlsxwriter = { version = "0.102.0", default-features = false }
